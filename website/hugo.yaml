# lania-g 文档站（Hugo + Hextra）
#
# 本地预览：
#   hugo server --source website
# 构建：
#   hugo --source website --minify
#
# 主题通过 Hugo Modules 引入（不需要 Node.js）。

baseURL: https://sao-lang.github.io/lania-g/
title: lania-g
defaultContentLanguage: zh-cn
enableRobotsTXT: true
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

params:
  description: 基于 Go 多模块工作区的声明-编译-执行 Web 应用框架
  displayUpdatedDate: true
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide
  page:
    width: wide
    displayPagination: true
  highlight:
    copy:
      enable: true
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # 使用仓库内 vendored 资源，避免构建期访问 CDN
      js: js/flexsearch.bundle.min.js
  mermaid:
    # 使用仓库内 vendored 资源，避免构建期访问 CDN
    js: js/mermaid.min.js
  toc:
    displayTags: false
  editURL:
    enable: false
  footer:
    displayCopyright: true
    displayPoweredBy: false

menu:
  main:
    - name: 文档
      pageRef: /docs
      weight: 1
    - name: 完整流程
      pageRef: /docs/guides
      weight: 2
    - name: 参考手册
      pageRef: /docs/reference
      weight: 3
    - name: 搜索
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: https://github.com/sao-lang/lania-g
      params:
        icon: github
